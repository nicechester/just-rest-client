<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dropdown</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-50">
    <h1 class="text-2xl font-bold mb-4">Import Dropdown Test</h1>
    
    <!-- Import Dropdown Button -->
    <div class="relative inline-block">
        <button id="import-dropdown-btn" class="bg-green-600 text-white font-bold px-4 py-2 rounded-lg hover:bg-green-700 transition duration-150 flex items-center space-x-2" title="Import">
            <span>Import</span>
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
        </button>
        <div id="import-dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 z-50">
            <button id="import-curl-btn" class="w-full text-left px-4 py-3 hover:bg-gray-100 text-gray-700 font-medium flex items-center space-x-2 rounded-t-lg">
                <span class="text-green-600">📄</span>
                <span>Import cURL</span>
            </button>
            <button id="import-postman-btn" class="w-full text-left px-4 py-3 hover:bg-gray-100 text-gray-700 font-medium flex items-center space-x-2 rounded-b-lg border-t border-gray-200">
                <span class="text-purple-600">📦</span>
                <span>Import Postman</span>
            </button>
        </div>
    </div>

    <script>
        const importDropdownBtn = document.getElementById('import-dropdown-btn');
        const importDropdownMenu = document.getElementById('import-dropdown-menu');
        
        importDropdownBtn.onclick = (e) => {
            e.stopPropagation();
            importDropdownMenu.classList.toggle('hidden');
            console.log('Dropdown toggled!');
        };
        
        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!importDropdownBtn.contains(e.target) && !importDropdownMenu.contains(e.target)) {
                importDropdownMenu.classList.add('hidden');
            }
        });
        
        document.getElementById('import-curl-btn').onclick = () => {
            alert('Import cURL clicked!');
            importDropdownMenu.classList.add('hidden');
        };
        
        document.getElementById('import-postman-btn').onclick = () => {
            alert('Import Postman clicked!');
            importDropdownMenu.classList.add('hidden');
        };
    </script>
</body>
</html>
