<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docs — Just REST Client</title>
  <link rel="icon" type="image/png" href="just.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .prose h1 { font-size: 2rem; font-weight: 800; margin: 1.5rem 0 1rem; }
    .prose h2 { font-size: 1.4rem; font-weight: 700; margin: 2rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid #e5e7eb; }
    .prose h3 { font-size: 1.1rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
    .prose h4 { font-size: 1rem; font-weight: 600; margin: 1.25rem 0 0.4rem; }
    .prose p { margin: 0.75rem 0; line-height: 1.75; color: #374151; }
    .prose a { color: #2563eb; text-decoration: underline; }
    .prose ul { list-style: disc; padding-left: 1.5rem; margin: 0.75rem 0; }
    .prose ol { list-style: decimal; padding-left: 1.5rem; margin: 0.75rem 0; }
    .prose li { margin: 0.3rem 0; line-height: 1.7; color: #374151; }
    .prose code { background: #f3f4f6; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.85em; font-family: monospace; color: #1f2937; }
    .prose pre { background: #111827; color: #d1fae5; padding: 1.25rem; border-radius: 0.75rem; overflow-x: auto; margin: 1rem 0; }
    .prose pre code { background: none; padding: 0; color: inherit; font-size: 0.8rem; }
    .prose blockquote { border-left: 4px solid #3b82f6; padding-left: 1rem; color: #6b7280; margin: 1rem 0; font-style: italic; }
    .prose table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9rem; }
    .prose th { background: #f9fafb; text-align: left; padding: 0.6rem 1rem; border: 1px solid #e5e7eb; font-weight: 600; }
    .prose td { padding: 0.6rem 1rem; border: 1px solid #e5e7eb; }
    .prose tr:hover td { background: #f9fafb; }
    .prose hr { border: none; border-top: 1px solid #e5e7eb; margin: 2rem 0; }
    .prose strong { font-weight: 600; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Nav -->
  <nav class="fixed top-0 w-full bg-white/90 backdrop-blur border-b border-gray-200 z-50">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition">
        <img src="just.png" alt="Just REST Client" class="h-8 w-8 rounded-lg">
        <span class="font-bold text-gray-900">Just REST Client</span>
      </a>
      <div class="flex items-center gap-6 text-sm font-medium text-gray-600">
        <a href="index.html#features" class="hover:text-blue-600 transition">Features</a>
        <a href="index.html#download" class="hover:text-blue-600 transition">Download</a>
        <a href="index.html#docs" class="hover:text-blue-600 transition">Docs</a>
        <a href="https://github.com/nicechester/just-rest-client" target="_blank" class="flex items-center gap-1 hover:text-blue-600 transition">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"/></svg>
          GitHub
        </a>
      </div>
    </div>
  </nav>

  <div class="pt-16 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="hidden md:flex flex-col w-56 flex-shrink-0 bg-white border-r border-gray-200 pt-8 px-4 fixed top-16 bottom-0 overflow-y-auto">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-2">Documentation</p>
      <nav id="doc-nav" class="space-y-1 text-sm"></nav>
    </aside>

    <!-- Content -->
    <main class="md:ml-56 flex-1 px-6 py-10 max-w-4xl mx-auto w-full">
      <div id="loading" class="text-center text-gray-400 py-20">Loading...</div>
      <article id="content" class="prose hidden"></article>
    </main>

  </div>

  <script>
    const DOCS = [
      { key: 'SCRIPTING',       label: '📖 Scripting Guide',       file: 'SCRIPTING.md' },
      { key: 'POSTMAN_IMPORT',  label: '📦 Postman Import',         file: 'POSTMAN_IMPORT.md' },
      { key: 'ARCHITECTURE',    label: '🏗️ Architecture',           file: 'ARCHITECTURE.md' },
      { key: 'TAURI',           label: '🖥️ Desktop App (Tauri)',    file: 'TAURI.md' },
      { key: 'CHANGELOG',       label: '📋 Changelog',              file: 'CHANGELOG.md' },
    ];

    const RAW_BASE = 'https://raw.githubusercontent.com/nicechester/just-rest-client/main/';

    const nav = document.getElementById('doc-nav');
    const params = new URLSearchParams(location.search);
    const activeKey = params.get('file') || DOCS[0].key;

    DOCS.forEach(doc => {
      const a = document.createElement('a');
      a.href = `docs.html?file=${doc.key}`;
      a.textContent = doc.label;
      const isActive = doc.key === activeKey;
      a.className = `block px-3 py-2 rounded-lg transition ${isActive
        ? 'bg-blue-50 text-blue-700 font-medium'
        : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900'}`;
      nav.appendChild(a);
    });

    const doc = DOCS.find(d => d.key === activeKey) || DOCS[0];
    document.title = `${doc.label.replace(/^\S+\s/, '')} — Just REST Client`;

    fetch(RAW_BASE + doc.file)
      .then(r => {
        if (!r.ok) throw new Error(r.statusText);
        return r.text();
      })
      .then(md => {
        document.getElementById('loading').classList.add('hidden');
        const el = document.getElementById('content');
        el.innerHTML = marked.parse(md);
        el.classList.remove('hidden');
        el.querySelectorAll('pre code.language-mermaid').forEach(code => {
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = code.textContent;
          code.closest('pre').replaceWith(div);
        });
        mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
        mermaid.run();
      })
      .catch(() => {
        document.getElementById('loading').textContent = 'Failed to load documentation.';
      });
  </script>
</body>
</html>
